# The tiers of design/08 §4, wired as jobs (design/09 §2.2 WS-L).
#
#   unit   tier 0 — no I/O at all, three Node majors. Must stay under 5 s.
#   live   tier 1 — PGlite, on ubuntu / macos / windows. **No Docker**, which is the whole point:
#                   `git clone && pnpm i && pnpm test:live` works on a first-time contributor's
#                   laptop, including Windows, where Postgres tooling usually gives up.
#   pg     tier 2 — a real server. PG 17 on every PR; 15/16/17/18 nightly (see ci-nightly.yml
#                   when WS7 lands). Everything guarded by requiresConcurrency() runs only here,
#                   and so do the kit's three end-to-end gates (design/11 K2b):
#                   `test/e2e/loop.test.ts` (edit schema → generate → apply → status → verify →
#                   check, as a role without CREATEDB, plus the PgBouncer refusal — which is why
#                   this job has a pooler), `test/corpus-thirdparty.test.ts` (01 §11.6 #5's four
#                   real schemas) and the CLI envelope goldens. None of them needs a new env var:
#                   PG_PRIME_TEST_URL, PG_PRIME_TEST_PGBOUNCER_URL and PG_PRIME_PG_DUMP below are
#                   exactly what they read.
#   types  the compile-time AND runtime-compile budgets (design/04 §3.5, design/03 Appendix B).
#          Its own job because it compiles ~40 generated programs on two TypeScript versions and
#          takes ~25 s, and because a budget that only exists in a JSON file is not a gate.
#   perf   design/08 §5's nine raw-vs-orm pairs, on a `perf` label only. Informational, never
#          blocking: a wall-clock database benchmark on a shared runner is noise, and gating on
#          noise trains people to re-run CI until it passes.
#
# One env var selects the target everywhere: PG_PRIME_TEST_URL set ⇒ that server, unset ⇒ PGlite.

name: ci

on:
  push:
    branches: [main]
  # `labeled` is here so that adding the `perf` label to an open PR starts the perf job without a
  # push; `reopened` has to be spelled out because naming `types` at all replaces the default set.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_PRIME_FUZZ_CASES: '10000'

jobs:
  unit:
    name: unit (tier 0) · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '24', '26']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  types:
    name: budgets — types (design/04 §3.5) + compile (design/03 Appendix B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Marginal instantiations per query at 25 and 300 tables on TS 5.9.3 + 7.0.2, the
      # schema-size-independence ratio, the design/04 §3.5 headline, and the package .d.ts size.
      # Exits non-zero on any breach; the three-way print (design/04 / here / budget) is in the log.
      - run: pnpm bench:types
      # The diagnostic goldens (design/04 §4). `pnpm type-errors` re-records after a deliberate change.
      - run: pnpm type-errors:check
      # design/09 WS7. The deterministic, no-database half of the runtime bench: compile time and
      # allocations for design/03 §1.1's 12-column / 2-join / 1-relation query, §1.1's two
      # structural claims (one `join('')`, one binds array), and the decoder against the hand-written
      # positional mapper. ~26 s including the `tsc` build of the package it imports.
      #
      # It lives here rather than in its own job because design/08 §4.6 budgets `bench:compile` +
      # `bench:types` together at under 3 minutes, and two jobs would pay for two checkouts and two
      # `pnpm install`s to save nothing. `--expose-gc` (in the package script) is what makes the
      # allocation numbers exact rather than merely stable.
      - run: pnpm bench:compile
      - name: Upload the bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-compile-report
          path: bench/runtime/report.json
          if-no-files-found: warn

  package:
    # design/08 §4.6's `package` row, and §2.4 step 5. The question this job answers is the one no
    # other job can: "is what we would publish installable, and is it still the shape we said?"
    # Nothing else in CI goes through the export map — every test imports `../../src/…`.
    #
    #   size-budget    §1.2's artifact budgets, measured from `npm pack --dry-run --json`, plus the
    #                  zero-dependency / zero-peer-dependency assertion.
    #   api-snapshot   §2.3's committed public-surface golden, and the assertion that the
    #                  `types@<5.9` stubs still mirror it.
    #   emit-parity    §3.1 — build twice, with tsgo 7.0.2 and with the consumer floor 5.9.3, and
    #                  diff the trees.
    #   check:dts      §3.2 — lib-check the EMITTED `dist/**/*.d.ts` with `skipLibCheck: false` on
    #                  both compilers. §4.6's `types` row asks for this and WS7 did not wire it.
    #   treeshake      §2.4 — esbuild + rollup, gzip budgets and the committed module-set goldens.
    #   pack-smoke     `pnpm pack` → install the tarballs into a throwaway project → compile and RUN
    #                  a consumer on TypeScript 5.9.3 → then prove the `types@<5.9` gate by watching
    #                  the same file fail on 5.8.3. Plus `publint --strict` and `attw --pack
    #                  --profile esm-only`.
    #
    # Node is pinned rather than matrixed: the artifact is compiler output, not runtime behaviour,
    # and the gzip baselines in tools/budgets.json are measured against one zlib. `pack-smoke`
    # reaches the npm registry twice (typescript 5.9.3, then 5.8.3). Measured 14.4 s on the design
    # machine against §4.6's 2-minute budget.
    name: package (design/08 §4.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm package:check

  live:
    name: live (tier 1, PGlite) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No services: block. PGlite boots one PostgreSQL 18.3 per test file, in-process.
      - run: pnpm test:live

  pg:
    name: pg (tier 2) · PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgprime
          POSTGRES_PASSWORD: pgprime
          POSTGRES_DB: pgprime
          # The harness asserts UTC rather than SET-ting it (design/02 §4.7), so the server has
          # to be started in it — every timestamptz golden is spelled in the session zone.
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pgprime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # design/09 WS6: `07` §5.1's transaction-pooling behaviour is a claim about a POOLER, so it
      # needs one. `MAX_PREPARED_STATEMENTS=200` is the configuration `07` §2.4 sizes our default
      # `maxPerConnection: 100` against, and it is what makes the named opt-in work through a
      # transaction pool at all — with it at 0, PgBouncer forwards our `Parse` to whichever server
      # connection the transaction lands on and the statement is gone by the next one.
      # `DB_HOST: postgres` is the other service's network alias; PgBouncer's own resolver reads it
      # through Docker's embedded DNS.
      pgbouncer:
        image: edoburu/pgbouncer:latest
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: pgprime
          DB_PASSWORD: pgprime
          DB_NAME: pgprime
          POOL_MODE: transaction
          MAX_PREPARED_STATEMENTS: '200'
          AUTH_TYPE: scram-sha-256
        ports: ['6432:5432']
    env:
      PG_PRIME_TEST_URL: postgres://pgprime:pgprime@127.0.0.1:5432/pgprime
      PG_PRIME_TEST_PGBOUNCER_URL: postgres://pgprime:pgprime@127.0.0.1:6432/pgprime
      # Debian's pg_wrapper resolves a bare `pg_dump` to the runner's preinstalled 16 even after 17
      # is installed; the kit's oracle refuses a client older than the server, so name the binary.
      PG_PRIME_PG_DUMP: '["/usr/lib/postgresql/17/bin/pg_dump"]'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pg_dump` for @pg-prime/kit's round-trip oracle; the client version must be >= the server's.
      # ubuntu-latest ships PostgreSQL 16 from the distro archive, so 17 comes from PGDG.
      - name: Install postgresql-client-17 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -sSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          pg_dump --version
      # The pgbouncer image ships no health check we can express here (no `pg_isready` in it), and
      # it starts before Postgres is ready, so it needs a wait rather than a `--health-cmd`. Failing
      # loudly beats letting `test/pg/executor.test.ts` report a connection error as a pooler bug.
      - name: Wait for PgBouncer
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/6432) 2>/dev/null; then echo "pgbouncer up"; exit 0; fi
            sleep 1
          done
          echo "pgbouncer never accepted a connection on 6432"; exit 1
      - run: pnpm test:pg

  perf:
    # design/08 §5: "On PRs labelled `perf`: the runtime benchmark runs and posts a 3-run-median
    # comparison. Informational, never blocking." So this job exists only when the label does, and
    # `continue-on-error` keeps a noisy shared runner from turning a correct PR red.
    #
    # It is a NEW job rather than a step on `pg`: that job's whole point is the tier-2 suite against
    # a PgBouncer topology, and a benchmark sharing a runner with a test suite measures the suite.
    name: perf (design/08 §5, `perf` label only)
    if: contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgprime
          POSTGRES_PASSWORD: pgprime
          POSTGRES_DB: pgprime
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pgprime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_PRIME_TEST_URL: postgres://pgprime:pgprime@127.0.0.1:5432/pgprime
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The full bench: the compile and decode sections plus design/08 §5's nine `raw()`/`orm()`
      # pairs, interleaved in one process. The three-way print (design / measured / budget) is in
      # the log; report.json is the artifact.
      - run: pnpm bench:runtime
      - name: Upload the bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-runtime-report-pr-${{ github.event.pull_request.number }}
          path: bench/runtime/report.json
          if-no-files-found: warn
